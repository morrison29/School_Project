{% extends 'school/base.html' %}
{% block auth_content %}
<div class="auth-layout">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🎓</div>
      <span>EduManage</span>
    </div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your account to continue</p>

    {% if messages %}
      {% for message in messages %}
        <div class="message {{ message.tags }}" style="margin-bottom:16px; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:500;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'school_app:login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username <span class="required">*</span></label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">Sign In</button>
    </form>

    <div style="text-align:center; margin-top:20px;">
      <a href="{% url 'school_app:home' %}" style="font-size:13px; color:#718096; text-decoration:none;">← Back to home</a>
    </div>
  </div>
</div>
{% endblock %}
